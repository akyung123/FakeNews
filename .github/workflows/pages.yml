name: pages

# Public preview for web/. Zero extra secrets (default GITHUB_TOKEN only).
# A person must enable Pages once: Settings → Pages → source GitHub Actions.
# Until that is on, the deploy job will fail. Expected URL:
#   https://<owner>.github.io/<repo>/
#   (this repo: https://prism-toggle-ai.github.io/FakeNews/)
#
# Vite base is set here from the repo name (`vite build --base $BASE_PATH`).
# No change to web/vite.config.* — other lanes own that file.
#
# Preview/demo must never ship mock World ID (PR #20: ON unless exactly 0 or false).
# VITE_WORLD_MOCK is hard-coded OFF here. Public VITE_* come from Actions variables.
# VITE_RPC_URL is the browser RPC (public / rate-limited), not the SEPOLIA_RPC_URL secret.
# Optional vars (WalletConnect) may be empty; do not fail the build.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hard-coded OFF. Must never be ON for preview/demo builds.
      VITE_WORLD_MOCK: "0"
      # Project Pages live at /<repo>/. Follow the current repository name.
      BASE_PATH: /${{ github.event.repository.name }}/
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Guard World mock is off
        working-directory: .
        run: |
          case "$VITE_WORLD_MOCK" in
            0|false) ;;
            *)
              echo "VITE_WORLD_MOCK must be 0 or false on preview/demo builds (got '$VITE_WORLD_MOCK'). Recording with mock ON is not valid World ID evidence." >&2
              exit 1
              ;;
          esac
      - name: Build
        env:
          VITE_WORLD_MOCK: "0"
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_LAUNCHPAD_ADDRESS: ${{ vars.VITE_LAUNCHPAD_ADDRESS }}
          # Optional. Empty = web uses a recent block range for Launched logs.
          VITE_LAUNCHPAD_DEPLOY_BLOCK: ${{ vars.VITE_LAUNCHPAD_DEPLOY_BLOCK }}
          VITE_HOOK_ADDRESS: ${{ vars.VITE_HOOK_ADDRESS }}
          VITE_LOCKER_ADDRESS: ${{ vars.VITE_LOCKER_ADDRESS }}
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_PARENT_NAME: ${{ vars.VITE_PARENT_NAME }}
          VITE_UNIVERSAL_RESOLVER: ${{ vars.VITE_UNIVERSAL_RESOLVER }}
          # Optional (PR #4). Empty vars must not fail the build.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_WORLD_SERVER_URL: ${{ vars.VITE_WORLD_SERVER_URL }}
          VITE_WORLD_APP_ID: ${{ vars.VITE_WORLD_APP_ID }}
          VITE_WORLD_ACTION: ${{ vars.VITE_WORLD_ACTION }}
          VITE_WORLD_RP_ID: ${{ vars.VITE_WORLD_RP_ID }}
        run: bunx tsc --noEmit && bunx vite build --base "$BASE_PATH"
      - name: Guard Pages asset prefix
        run: |
          html=dist/index.html
          test -f "$html"
          bad="$(grep -oE '(src|href)="[^"]+"' "$html" | grep -E '(src|href)="/' | grep -vE "(src|href)=\"${BASE_PATH}" || true)"
          if [[ -n "$bad" ]]; then
            echo "Asset/favicon URLs must start with ${BASE_PATH}:" >&2
            echo "$bad" >&2
            exit 1
          fi
          if ! grep -qE "(src|href)=\"${BASE_PATH}" "$html"; then
            echo "dist/index.html has no ${BASE_PATH} asset URLs. Was vite build --base ${BASE_PATH} used?" >&2
            exit 1
          fi
      - name: SPA fallback
        # GitHub Pages serves 404.html for unknown paths (/p/:name, /n/:name, /create).
        run: |
          cp dist/index.html dist/404.html
          test -f dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
