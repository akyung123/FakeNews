name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # No lint/typecheck scripts on the current web skeleton. tsc is the check.
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun run test
      - run: bun run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # Fork tests read one fixed block, so Foundry's RPC cache (restored below)
      # answers reruns without spending the Sepolia RPC key. Raise it with the
      # repo variable when a test needs newer chain state.
      SEPOLIA_FORK_BLOCK: ${{ vars.SEPOLIA_FORK_BLOCK || '11788197' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge build
      - name: Restore fork RPC cache
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          # Cache entries cannot be overwritten. A per-run key saves the slots each
          # run adds; restore-keys picks up the newest one for this block.
          key: foundry-rpc-sepolia-${{ env.SEPOLIA_FORK_BLOCK }}-${{ github.run_id }}
          restore-keys: foundry-rpc-sepolia-${{ env.SEPOLIA_FORK_BLOCK }}-
      # Only a PR that touches contracts (or this file) spends the RPC key.
      # Pushes to the default branch always do.
      - name: Detect contracts change
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${BASE_REF}...HEAD" -- . ../.gitmodules ../.github/workflows/ci.yml; then
            echo "contracts=false" >> "$GITHUB_OUTPUT"
            echo "No contracts change. LockReal skips; CCA fork tests use the public RPC."
          else
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          fi
      # PR #19 LockReal tests skip when this is empty. Missing secret must not fail CI.
      # Fork PRs do not receive Actions secrets, so those runs stay skipped and still pass.
      # Export only when there is a URL: an empty SEPOLIA_RPC_URL would make the
      # CCA fork tests skip instead of falling back to the public RPC.
      # The public RPC prunes old state, so without the key the fork tests run on
      # the latest block instead of the pinned one.
      - name: Test
        env:
          RPC: ${{ steps.changed.outputs.contracts == 'true' && secrets.SEPOLIA_RPC_URL || '' }}
        run: |
          if [[ -n "$RPC" ]]; then export SEPOLIA_RPC_URL="$RPC"; else unset SEPOLIA_FORK_BLOCK; fi
          forge test -vv

  detect-world:
    # hashFiles is not valid on a job-level if. Detect after checkout instead.
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [[ -f world/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "world/ is not in the repo yet."
          fi

  world:
    # Skipped (not a fake pass) until world/package.json exists.
    needs: detect-world
    if: needs.detect-world.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # world/package.json has test only (no lint / typecheck / build).
      - run: bun test
