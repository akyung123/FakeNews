[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"

# ENSv2 at contracts-v2 `71a3b73` (docs/ENSV2.md section 0). Adapter compiles
# against local interfaces; this remapping is for later Launchpad work.
remappings = [
    "@ensdomains/contracts-v2/=lib/contracts-v2/contracts/src/",
    "@openzeppelin/contracts/=lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
]
