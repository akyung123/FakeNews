[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../docs/fixtures" },
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 16
