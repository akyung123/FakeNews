[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
gas_limit = "300000000"
fs_permissions = [{ access = "read", path = "./" }]

# ENSv2 at contracts-v2 `71a3b73` (docs/ENSV2.md section 0).
# Uniswap v4-core at tag v4.0.0 (e50237c).
remappings = [
    "@ensdomains/contracts-v2/=lib/contracts-v2/contracts/src/",
    "@openzeppelin/contracts/=lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256
